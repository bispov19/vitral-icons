# Configuração do tema Brisa.
# Tudo o que é ajustável (paleta, proporções, intensidades) mora aqui; os
# geradores de cada parte (icons/, gtk/, shell/) leem este arquivo.

[tema]
nome = "Brisa"

[paleta]
coral = "#F0685A"
ambar = "#F5B53F"
menta = "#4FC7A2"
# Superfícies grafite (tile dos ícones e, nas próximas fases, janelas e Shell)
grafite_topo = "#2B2B2E"
grafite_base = "#151517"

# ── Ícones ────────────────────────────────────────────────────────────────
[icones]
# Tamanho do tile no quadro de 128 (112 = margem de 8; 120 = margem de 4, o
# tamanho dos ícones maiores do Conflux) e a escala dos ícones avulsos (pastas,
# documentos), para a pasta ficar com ~116 de largura como no Conflux.
tile_lado = 120
avulsos_escala = 1.07
# Peso visual: fração da área do tile ocupada pela silhueta do logo
# (alvo de 38 a 42%) e limite do maior lado do logo, em fração do tile.
area_alvo = 0.40
lado_maximo = 0.84
# Glifos que não passam pela normalização de área (layout fixo).
sem_normalizar = ["calendario"]
# TINT_RIM: quanto a borda de luz do tile puxa para a cor principal do logo
# (0 = borda branca, 1 = borda na cor do logo).
tint_rim = 0.35
# TRASH_STYLE: "tile" (lixeira prateada no tile escuro) ou "avulsa" (sem tile).
trash_style = "tile"
# Tamanhos fixos gerados em PNG (além do scalable).
tamanhos = [16, 24, 32, 48, 64, 128, 256]
# A partir de qual tamanho o scalable passa a valer (abaixo usam-se os PNGs).
scalable_min = 96
# Tamanho máximo dos PNGs embutidos nos SVGs (logos originais em bitmap).
max_png_embutido = 256

# Aparência do tile nos tamanhos grandes (>= 48 px).
[icones.tile]
borda_opacidade = 0.24      # borda interna de 1px
borda_px = 1.0              # espessura da borda, em pixels do tamanho final
reflexo_opacidade = 0.12    # reflexo largo na metade de cima
brilho_opacidade = 0.70     # brilho fino na borda de cima
sombra_interna = 0.45
sombra_contato = 0.30       # sombra de contato na base
sombra_logo = 0.50          # sombra projetada sob o logo

# Nos tamanhos pequenos (<= 32 px) a borda engrossa e o reflexo simplifica.
[icones.tile_pequeno]
ate_px = 32
borda_opacidade = 0.42
borda_px = 1.0
reflexo_opacidade = 0.0
brilho_opacidade = 0.55
sombra_interna = 0.0
sombra_contato = 0.0
sombra_logo = 0.0

# Cor da etiqueta de cada categoria de tipo de arquivo.
[icones.etiquetas]
documento = "#5B8DEF"
planilha = "#4FC7A2"
apresentacao = "#F5B53F"
pdf = "#F0685A"
imagem = "#B57CF0"
audio = "#F06A9B"
video = "#36B5D8"
texto = "#9A9AA2"
codigo = "#4A4A52"
compactado = "#B8875A"
executavel = "#6C7CF2"

# ── GTK 3 e GTK 4 / libadwaita ───────────────────────────────────────────
[gtk]
# Destaque (accent): nome de uma cor da paleta ou um hex. O texto sobre ele
# é escolhido automaticamente para passar no contraste AA (4,5:1).
accent = "menta"
raio_janela = 14

# Superfícies grafite, do fundo mais escuro ao mais claro.
[gtk.superficies]
conteudo = "#19191C"            # listas, editores de texto
janela = "#1E1E21"
barra_lateral_secundaria = "#1F1F22"
barra_lateral = "#232326"
barra_titulo_sem_foco = "#212124"
barra_titulo = "#28282B"
dialogo = "#2A2A2E"
popover = "#2C2C30"
miniatura = "#303034"
texto = "#F2F2F5"

# Botões de fechar, minimizar e maximizar (círculos à esquerda), nas medidas
# do macOS: 12px de diâmetro e 8px entre eles.
[gtk.botoes_janela]
tamanho = 12
espaco = 8
borda_mais_escura = 0.22      # quanto a borda de 1px escurece a cor do botão
glifo = "rgba(0, 0, 0, 0.6)"  # cor do ✕ − ⤢, visível só com o mouse sobre o grupo
sem_foco = "#48484D"          # círculos da janela sem foco

# ── GNOME Shell (tema carregado pela extensão oficial User Themes) ───────
[shell]
# Destaque dos toggles, sliders e seleções (nome da paleta ou hex).
accent = "menta"
# Painel superior translúcido, estilo macOS.
painel_cor = "#151517"
painel_opacidade = 0.55
# Vidro escuro dos menus, menu rápido, calendário, notificações, OSD e Alt+Tab.
vidro_cor = "#1E1E21"
vidro_opacidade = 0.86
vidro_borda_opacidade = 0.12  # borda interna branca de 1px
raio = 18                      # cantos dos menus e painéis flutuantes
raio_itens = 12                # cantos dos itens dentro deles
