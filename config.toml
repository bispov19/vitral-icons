# Configuração do Vitral-icons.
# Tudo o que é ajustável (paleta, proporções, intensidades e as cores de cada
# variante) mora aqui; o gerador (icons/gerar.py) lê este arquivo.

[paleta]
coral = "#F0685A"
ambar = "#F5B53F"
menta = "#4FC7A2"

[icones]
# Tamanho do tile no quadro de 128 (112 = margem de 8; 120 = margem de 4) e a
# escala dos ícones avulsos (pastas, documentos), para a pasta ficar com ~116
# de largura.
tile_lado = 120
avulsos_escala = 1.07
# Peso visual: fração da área do tile ocupada pela silhueta do logo
# (alvo de 38 a 42%) e limite do maior lado do logo, em fração do tile.
area_alvo = 0.40
lado_maximo = 0.84
# Glifos que não passam pela normalização de área (layout fixo).
sem_normalizar = ["calendario"]
# TRASH_STYLE: "avulsa" (cesto fosco solto, como no dock do Mac) ou "tile" (o mesmo cesto no tile).
trash_style = "avulsa"
# Tamanhos fixos gerados em PNG (além do scalable).
tamanhos = [16, 24, 32, 48, 64, 128, 256]
# A partir de qual tamanho o scalable passa a valer (abaixo usam-se os PNGs).
scalable_min = 96
# Tamanho máximo dos PNGs embutidos nos SVGs (logos originais em bitmap).
max_png_embutido = 256

# Aparência do tile nos tamanhos grandes (>= 48 px). Valores da variante
# escura; a clara sobrescreve o que precisa em [variantes.clara.tile].
[icones.tile]
borda_opacidade = 0.24      # borda interna de 1px
borda_px = 1.0              # espessura da borda, em pixels do tamanho final
reflexo_opacidade = 0.12    # reflexo largo na metade de cima
brilho_opacidade = 0.70     # brilho fino na borda de cima
sombra_interna = 0.45
sombra_contato = 0.30       # sombra de contato na base
sombra_logo = 0.50          # sombra projetada sob o logo

# Nos tamanhos pequenos (<= 32 px) a borda engrossa e o reflexo simplifica.
[icones.tile_pequeno]
ate_px = 32
borda_opacidade = 0.42
borda_px = 1.0
reflexo_opacidade = 0.0
brilho_opacidade = 0.55
sombra_interna = 0.0
sombra_contato = 0.0
sombra_logo = 0.0

# Cor da etiqueta de cada categoria de tipo de arquivo.
[icones.etiquetas]
documento = "#5B8DEF"
planilha = "#4FC7A2"
apresentacao = "#F5B53F"
pdf = "#F0685A"
imagem = "#B57CF0"
audio = "#F06A9B"
video = "#36B5D8"
texto = "#9A9AA2"
codigo = "#4A4A52"
compactado = "#B8875A"
executavel = "#6C7CF2"

# ── Variantes ─────────────────────────────────────────────────────────────
# Cada variante vira um tema de ícones completo e instalável sozinho, com o
# seu próprio index.theme. Os desenhos e os logos são os mesmos; mudam só as
# cores do tile, da borda, dos glifos e as intensidades de sombra e brilho.
#
#   tile_topo, tile_base     gradiente vertical do tile
#   borda_base, tint_rim     cor da borda interna antes de puxar para a cor
#                            principal do logo, e quanto ela puxa (TINT_RIM:
#                            0 = só a cor base, 1 = a cor do logo)
#   branco_topo, branco_base superfícies brancas dos desenhos (papel, cartões,
#                            mostrador do relógio, nuvem, mouse...)
#   tinta_topo, tinta_base   glifos desenhados direto sobre o tile (número do
#                            Calendário, ponteiro do Monitor do sistema)
#   contorno_logo            opacidade de um contorno fino e escuro em volta
#                            do logo, que separa branco sobre branco
#   escurecer_logos_claros   logos de marca brancos ou prateados (sem cor)
#                            viram grafite para não sumir no tile claro

[variantes.escura]
nome = "Vitral-icons"
comentario = "Tiles escuros de vidro com os logos coloridos dos apps"
tile_topo = "#2B2B2E"
tile_base = "#151517"
borda_base = "#FFFFFF"
tint_rim = 0.35
branco_topo = "#FFFFFF"
branco_base = "#DADADF"
tinta_topo = "#FFFFFF"
tinta_base = "#DADADF"
contorno_logo = 0.0
escurecer_logos_claros = false

[variantes.clara]
nome = "Vitral-icons-Light"
comentario = "Tiles claros com os logos coloridos dos apps"
tile_topo = "#FFFFFF"
tile_base = "#E8E8ED"
borda_base = "#8A8A93"
tint_rim = 0.55
branco_topo = "#FFFFFF"
branco_base = "#E4E4E9"
tinta_topo = "#3A3A3F"
tinta_base = "#1C1C20"
contorno_logo = 0.16
escurecer_logos_claros = true

[variantes.clara.tile]
borda_opacidade = 0.30
reflexo_opacidade = 0.0
brilho_opacidade = 0.0
sombra_interna = 0.05
sombra_contato = 0.18
sombra_logo = 0.22

[variantes.clara.tile_pequeno]
borda_opacidade = 0.45
brilho_opacidade = 0.0
